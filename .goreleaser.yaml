# ebb is macOS-only and needs cgo, so releases build on a macOS runner and ship
# one universal binary.
version: 2

# The web UI is built before GoReleaser runs (make ui; in CI a step of its
# own), so package scripts never share an environment with the signing keys.

builds:
  - main: ./cmd/ebb
    binary: ebb
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/doguyilmaz/ebb/internal/cli.Version={{ .Version }}

universal_binaries:
  - replace: true

# Developer ID signature with the hardened runtime, then notarization, so
# Gatekeeper opens it without a prompt. Releases fail without the secrets;
# snapshots skip it.
notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # The cask points at the archive right away; Gatekeeper must find the ticket.
        wait: true
        timeout: 20m

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_universal"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test"]

homebrew_casks:
  - name: ebb
    binaries: [ebb]
    repository:
      owner: doguyilmaz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_msg_template: "{{ .ProjectName }} {{ .Tag }}"
    homepage: https://github.com/doguyilmaz/ebb
    description: See where your Mac's disk space went and win it back safely
    license: MIT
    # The background service runs this binary; it must stop with it.
    uninstall:
      launchctl: [com.doguyilmaz.ebb]
    zap:
      trash: ["~/.config/ebb", "~/.local/state/ebb"]

release:
  github:
    owner: doguyilmaz
    name: ebb
