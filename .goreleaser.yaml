# ebb is macOS-only and needs cgo, so releases build on a macOS runner and ship
# one universal binary.
version: 2

# The web UI is built before GoReleaser runs (make ui; in CI a step of its
# own), so package scripts never share an environment with the signing keys.

builds:
  - main: ./cmd/ebb
    binary: ebb
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/doguyilmaz/ebb/internal/cli.Version={{ .Version }}

universal_binaries:
  - replace: true
    # ebb.app wraps the same binary, signed ad hoc; the tapster hub signs and notarizes it.
    hooks:
      post:
        - cmd: scripts/macapp.sh "{{ .Version }}" "{{ .Path }}"
          output: true

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_universal"
    files:
      - README.md
      - LICENSE
      - src: dist/macapp/ebb.app
        dst: ebb.app

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  format: "{{ .Message }}"
  filters:
    exclude: ["^docs", "^test"]

release:
  github:
    owner: doguyilmaz
    name: ebb
  header: |
    Install with `brew install doguyilmaz/tap/ebb`. `ebb.app` and the bare `ebb` binary are universal (Apple silicon and Intel), signed with a Developer ID and notarized.
  draft: true
