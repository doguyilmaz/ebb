[[rule]]
id = "browser.firefox"
title = "Firefox cache"
owner = "Firefox"
category = "app-cache"
paths = ["~/Library/Caches/Firefox/Profiles/*/cache2", "~/Library/Caches/Firefox/Profiles/*/startupCache", "~/Library/Caches/Firefox/Profiles/*/thumbnails"]
safety = "regenerable"
why = "Firefox caches pages and images of sites per profile, outside the profile itself."
impact = "Sites load a little slower the first time. Your profile (bookmarks, history, passwords) is not touched."
min_size = "100MB"
action = { kind = "delete", quit = ["firefox"] }
