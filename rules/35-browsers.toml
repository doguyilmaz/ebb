# Browser caches: page data, compiled scripts, GPU shaders and service worker caches. Never profiles, cookies,
# history, passwords or extensions. One rule per browser, so a running browser blocks only its own cache.

[[rule]]
id = "browser.safari"
title = "Safari cache"
owner = "Safari"
category = "app-cache"
paths = ["~/Library/Caches/com.apple.Safari", "~/Library/Containers/com.apple.Safari/Data/Library/Caches"]
safety = "regenerable"
why = "Safari caches pages, images and scripts of sites you visited."
impact = "Sites load a little slower the first time. You stay signed in: cookies and history are not touched."
min_size = "100MB"
action = { kind = "delete", quit = ["Safari"] }

[[rule]]
id = "browser.chrome"
title = "Chrome cache"
owner = "Google Chrome"
category = "app-cache"
paths = [
  "~/Library/Caches/Google/Chrome",
  "~/Library/Application Support/Google/Chrome/*/{Cache,Code Cache,GPUCache,DawnGraphiteCache,DawnWebGPUCache}",
  "~/Library/Application Support/Google/Chrome/*/Service Worker/CacheStorage",
]
safety = "regenerable"
why = "Chrome caches pages, compiled scripts, GPU shaders and offline data of sites, per profile."
impact = "Sites load a little slower the first time. You stay signed in: cookies, history and passwords are not touched."
min_size = "100MB"
action = { kind = "delete", quit = ["Google Chrome"] }

