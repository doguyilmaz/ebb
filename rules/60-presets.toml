[[preset]]
id = "dev-caches"
title = "Developer caches"
categories = ["package-cache", "build-artifact"]
max_safety = "regenerable"

[[preset]]
id = "simulators"
title = "Unused simulators and old runtimes"
categories = ["simulator"]
max_safety = "caution"

[[preset]]
id = "stale-projects"
title = "Build folders of untouched projects"
categories = ["stale-project"]
max_safety = "regenerable"

[[preset]]
id = "logs"
title = "Logs and crash reports"
categories = ["logs"]
max_safety = "regenerable"

[[preset]]
id = "installers"
title = "Installers and disk images"
categories = ["installer"]
max_safety = "caution"

[[preset]]
id = "all-regenerable"
title = "Everything tools can rebuild"
categories = ["package-cache", "build-artifact", "sdk", "app-cache", "logs", "simulator", "stale-project"]
max_safety = "regenerable"

[[preset]]
id = "browsers"
title = "Browser caches"
rules = ["browser.safari", "browser.chrome", "browser.brave", "browser.edge", "browser.arc", "browser.vivaldi", "browser.firefox"]
max_safety = "regenerable"

[[preset]]
id = "leftovers"
title = "Leftovers of removed apps"
categories = ["leftover"]
max_safety = "caution"
