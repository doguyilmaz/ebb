name: CI

# ebb needs cgo against macOS frameworks, so everything runs on macOS. The e2e
# pass drives the preinstalled Chrome and runs after merges only.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "assets/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "assets/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - run: make check

  e2e:
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: cd ui && bun install --frozen-lockfile
      - run: scripts/e2e.sh
